<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2738"/>
      <stop offset="1" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="cup" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c92a21"/>
      <stop offset="0.35" stop-color="#ff5a4e"/>
      <stop offset="1" stop-color="#d32d24"/>
    </linearGradient>
    <radialGradient id="ball" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9dde8"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- The shot: a dashed arc from the left, dropping into the cup. -->
  <path d="M 70 300 Q 150 70 270 150" fill="none" stroke="#64d2ff" stroke-width="12" stroke-linecap="round" stroke-dasharray="0.1 30"/>
  <!-- The cup, side on: body, white rim, two ridges. -->
  <path d="M 168 236 L 344 236 L 320 430 Q 318 446 302 446 L 210 446 Q 194 446 192 430 Z" fill="url(#cup)"/>
  <rect x="156" y="216" width="200" height="32" rx="12" fill="#f4f6fb"/>
  <path d="M 178 312 L 334 312" stroke="#ff8c82" stroke-width="7" stroke-linecap="round" opacity="0.8"/>
  <path d="M 186 372 L 326 372" stroke="#ff8c82" stroke-width="7" stroke-linecap="round" opacity="0.8"/>
  <circle cx="290" cy="170" r="27" fill="url(#ball)" stroke="#090d16" stroke-width="5"/>
</svg>
